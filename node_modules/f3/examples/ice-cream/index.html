<!DOCTYPE html>
<html>
<head>
	<title>F3 Example</title>
	<link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.2.0/css/bootstrap.min.css">
</head>
<body>

<div class="panel panel-default">

	<div class="panel-heading">F3 Example</div>

	<div class="panel-body">

		<!-- Element where insert the F3 -->
		<div id="f3-ic"></div>

	</div>

	<div class="panel-footer" style="display: none;">
			
		<h5>Responses</h5>

		<!-- Where show the responses -->
		<ul id="responses"></ul>

	</div>

</div>

<!-- F3 Dependencies -->
<script src="https://code.jquery.com/jquery-1.11.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/jquery.dform/1.1.0/jquery.dform.min.js"></script>
<script src="https://ajax.aspnetcdn.com/ajax/jquery.validate/1.12.0/jquery.validate.min.js"></script>
<script src="https://cdn.jsdelivr.net/pubsubjs/1.4.2/pubsub.min.js"></script>

<!-- F3 -->
<script src="../../dist/f3.min.js"></script>
<script src="tree.js"></script>

<script>
	
$(document).ready(function(){

	var formTree = f3();

	//Target where insert the F3
	var $target = $('#f3-ic');

	//Function to show the user's responses
	var submit = function(){

		//Subscription when the user has complete the F3
		PubSub.subscribe('f3.send', function(){

			//Get the visibles branches
			var $branches = $target.find('form[branch]:visible');

			//Get the wrapper
			var $responses = $('#responses');

			//Remove previous responses
			$responses.empty();

			//Show the responses
			$branches.each(function(){

				//Serialize all responses
				var responses = $(this).serializeArray();

				//If there are responses
				if(responses.length > 0){

					//Show each response
					$.each(responses, function(index, response){

						$responses.append('<li><strong>' + response.name + ':</strong> ' + response.value + '</li>');

					});

				}

			});

			//Show the wrapper
			$responses.parent('.panel-footer').slideDown();

		});

	};

	//Init submit
	submit();

	//Init F3
	formTree.init();

	//Render F3. Note: Tree is a global variable from tree.js
	formTree.render($target, tree);

});
</script>

</body>
</html>
